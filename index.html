<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Site privé : on demande aux moteurs de recherche de ne pas l'indexer -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light dark">
  <title>QCM Restructuring – Entraînement</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="Retour à l'accueil">
      <span class="brand-mark">Q</span>
      <span class="brand-text">Turnaround &amp; Restructuring <small>entraînement QCM</small></span>
    </button>
    <div id="topinfo" class="topinfo" aria-live="polite"></div>
  </header>

  <main id="app" class="wrap"><p class="muted">Chargement…</p></main>

  <dialog id="dlg">
    <form method="dialog">
      <p id="dlg-msg"></p>
      <div class="dlg-actions">
        <button value="cancel" class="btn ghost" id="dlg-no">Annuler</button>
        <button value="ok" class="btn primary" id="dlg-yes">OK</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
